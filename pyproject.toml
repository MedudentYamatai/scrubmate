[project]
name = "scrubmate"
version = "0.1.0"
description = "ScrubMate: 声で渡し、目で数える器械出しロボット (MuJoCo シミュレーション)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mujoco>=3.3",
    "robot-descriptions>=1.15",
    "numpy>=1.26",
    "pillow>=10.0",
    "imageio>=2.34",
    "imageio-ffmpeg>=0.5",
    "ultralytics>=8.4.188",
    "mlx-whisper>=0.4.3",
    "google-genai>=2.33.0",
    "python-dotenv>=1.2.4",
    "pykakasi>=2.3.0",
]

[tool.uv]
# アプリ (スクリプト群) として使うので、パッケージとしてはビルドしない。
# `uv run python -m sim.xxx` はリポジトリ直下から実行する前提。
package = false
